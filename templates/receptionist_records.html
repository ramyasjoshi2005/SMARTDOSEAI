<!DOCTYPE html>
<html>

<head>

    <title>Receptionist Patient Records</title>

    <style>

        body {

            font-family: Arial;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {

            width: 700px;
            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h1 {

            text-align: center;

            color: #007bff;
        }

        input,
        select,
        button {

            width: 100%;

            padding: 12px;

            margin-top: 12px;

            border-radius: 8px;

            border: 1px solid #ccc;
        }

        button {

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Create Patient Record</h1>

    <form action="/save_patient" method="POST">

        <input
            type="text"
            name="patient_id"
            placeholder="Patient ID"
            required
        >

        <input
            type="text"
            name="patient_name"
            placeholder="Patient Name"
            required
        >

        <input
            type="number"
            name="age"
            placeholder="Age"
            required
        >

        <select name="gender">

            <option>Male</option>
            <option>Female</option>

        </select>

        <input
            type="text"
            name="blood_group"
            placeholder="Blood Group"
        >

        <input
            type="text"
            name="assigned_doctor"
            placeholder="Assigned Doctor"
        >

        <button type="submit">

            Save Patient

        </button>

    </form>

</div>

</body>

</html>
