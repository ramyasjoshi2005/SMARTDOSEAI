<!DOCTYPE html>

<html>

<head>

    <title>Patient Record Saved</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Poppins;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(rgba(4,15,40,0.94),
            rgba(4,15,40,0.94)),
            url("https://images.unsplash.com/photo-1584982751601-97dcc096659c?q=80&w=2070");

            background-size:cover;
            background-position:center;

            color:white;
        }

        .card{

            width:550px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(14px);

            border-radius:28px;

            padding:60px;

            text-align:center;

            border:
            1px solid rgba(255,255,255,0.08);
        }

        h1{

            color:#00d4ff;

            font-size:44px;

            margin-bottom:20px;
        }

        p{

            color:#ddd;

            font-size:19px;

            line-height:1.8;

            margin-bottom:35px;
        }

        .btn{

            display:inline-block;

            text-decoration:none;

            background:
            linear-gradient(90deg,#00d4ff,#007bff);

            padding:16px 30px;

            border-radius:14px;

            color:white;

            font-size:18px;

            font-weight:600;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>

        ✅ Patient Record Saved

    </h1>

    <p>

        Patient registration details and
        medical history were successfully
        stored in the hospital records.

    </p>

    <a href="/history"
    class="btn">

        Open Medical Records →

    </a>

</div>

</body>

</html>
